# spy_network ability registry — Wave 3 acceptance fixture (deferred
# to Phase 6 in the parent merge `ae122fd8 Merge: ToM Phase 5 — disguise
# SoA integration (spy_network sim deferred to Phase 6)`).
#
# This TOML covers the subset of the spec's spy_network ability set
# that maps cleanly onto today's `EffectOp` vocabulary (Wave 3 ToM
# Phase 1-5 + Wave 2 control verbs + Wave 1 Damage). Verbs the spec
# expects but the engine doesn't yet wire as `EffectOp` variants are
# either substituted (e.g. `befriend N` → `ModifyStanding{delta=N}`)
# or marked as a TODO for the Phase 6 follow-up:
#
#   - `slander third_party by N`  → not in EffectOp (3-party standing
#     modifier; today's ModifyStanding is symmetric caster↔target only).
#     Substituted with `ModifyStanding{delta=-N}` (slanders the TARGET
#     directly, no third-party indirection — close-but-not-perfect).
#   - `duel_challenge`            → not in EffectOp. Substituted with
#     `Damage{amount=20}` (forces an HP delta as a smoke-stand-in for
#     the eventual challenge → engagement → duel cascade).
#   - `plant_belief target of subject { last_known_creature_type: ... }`
#     → today's `PlantBelief` is bit-flag only (`{subject_idx, fact_bit}`).
#     Substituted with the bit-flag form so the verb path lights up;
#     full field-write needs the structured-payload extension Phase 6
#     plans to land.
#
# Slot order is source-order (first `[[ability]]` lands at AbilityId(1)):
#   1: Disguise, 2: PlantRumor, 3: Slander, 4: VanishingAct,
#   5: ChallengeToDuel, 6: Decree.

# ---- Spy abilities (slots 1..=4) ----

# Slot 1 / AbilityId(1) — Disguise as commoner for 60s.
# `fake_type = 2` is the spec's commoner creature_type code (0 = spy,
# 1 = noble, 2 = commoner — runtime-side convention pinned in the
# fixture's seeder, not in engine code). 600 ticks = 60s @ 100ms tick.
[[ability]]
name = "Disguise"
range = 0.0
gate = { cooldown_ticks = 300, hostile_only = false, line_of_sight = false }
target_mode = "SelfCast"
hint = "utility"

[[ability.effects]]
op = "Disguise"
fake_type = 2
duration_ticks = 600

# Slot 2 / AbilityId(2) — PlantRumor (bit-flag plant_belief stand-in).
# Spec wants `plant_belief target of subject { last_known_creature_type:
# dragon }`; today's PlantBelief only writes a fact_bit. The bit-flag
# form lights up the chronicle / consumer / pair_map fold path; the
# structured-payload extension is Phase 6 work.
[[ability]]
name = "PlantRumor"
range = 3.0
gate = { cooldown_ticks = 50, hostile_only = true, line_of_sight = false }
target_mode = "Enemy"
hint = "utility"

[[ability.effects]]
op = "PlantBelief"
subject_idx = 0  # placeholder — apply handler picks subject at cast time
fact_bit = 0     # bit 0 = "rumor planted"

# Slot 3 / AbilityId(3) — Slander.
# Spec form: `slander third_party by 15`. No 3-party EffectOp today;
# substituted with `ModifyStanding{delta=-15}` against the target (the
# slandered party). Acceptable smoke for Phase 6 prototyping; the
# noble-vs-noble cascade pin in the runtime crate's doc comment is
# what the eventual `slander third_party` verb would close out.
[[ability]]
name = "Slander"
range = 5.0
gate = { cooldown_ticks = 30, hostile_only = true, line_of_sight = false }
target_mode = "Enemy"
hint = "utility"

[[ability.effects]]
op = "ModifyStanding"
delta = -15

# Slot 4 / AbilityId(4) — VanishingAct.
[[ability]]
name = "VanishingAct"
range = 0.0
gate = { cooldown_ticks = 600, hostile_only = false, line_of_sight = false }
target_mode = "SelfCast"
hint = "utility"

[[ability.effects]]
op = "Stealth"
duration_ticks = 80

# ---- Noble abilities (slots 5..=6) ----

# Slot 5 / AbilityId(5) — ChallengeToDuel.
# Spec form: `duel_challenge` (engagement verb — not in EffectOp).
# Substituted with `Damage{amount=20}` so the cast path lights up as
# a smoke-stand-in for an eventual standing-gated duel cascade. The
# spec's `when target_standing_below(-50)` predicate isn't expressible
# as a TOML modifier today; the runtime would gate the cast in its
# .sim verb body.
[[ability]]
name = "ChallengeToDuel"
range = 8.0
gate = { cooldown_ticks = 300, hostile_only = true, line_of_sight = false }
target_mode = "Enemy"
hint = "damage"

[[ability.effects]]
op = "Damage"
amount = 20.0

# Slot 6 / AbilityId(6) — Decree.
# Spec form: `befriend 25` (positive standing modifier toward an ally).
# `befriend` not in EffectOp; substituted with `ModifyStanding{delta=25}`.
[[ability]]
name = "Decree"
range = 12.0
gate = { cooldown_ticks = 600, hostile_only = false, line_of_sight = false }
target_mode = "Ally"
hint = "utility"

[[ability.effects]]
op = "ModifyStanding"
delta = 25
