[package]
name = "apply_ability_chronicle_consumer_runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Per-fixture runtime crate for
# `assets/sim/apply_ability_chronicle_consumer.sim` — task #138 closed-loop
# demo. Hosts BOTH halves of the chronicle pipeline and runs them through
# wgpu in a single tick:
#
#   1. `physics_DispatchAbility` — apply_ability dispatcher writes
#      EffectDamageApplied chronicle records into event_ring (same kernel
#      as `apply_ability_smoke_runtime`).
#   2. `physics_ApplyChronicleDamage` — PerEvent consumer reads those
#      records and decrements `agent_hp[target]` via `agents.set_hp(...)`.
#
# Because the consumer rule trips P6 (PerEvent + agents.set_hp), the
# build.rs tolerates the lower diagnostic the same way
# `duel_abilities_runtime/build.rs` does (returns `o.program` from the
# `DriverOutcome::Err` path, kernels emit anyway). The
# `apply_ability_chronicle_consumer_compiles_with_tolerated_p6` test in
# `crates/dsl_compiler/tests/apply_ability_smoke.rs` already pins the
# diagnostic shape; this crate exists to actually RUN the loop and prove
# `agent_hp` decreases per tick.
#
# Mirror: `apply_ability_smoke_runtime` for the dispatcher half +
# wgpu wiring; `duel_abilities_runtime/build.rs` for the tolerated-Err
# lower pattern.

[dependencies]
engine = { path = "../engine" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
dsl_compiler = { path = "../dsl_compiler" }

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }
