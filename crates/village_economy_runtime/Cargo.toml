[package]
name = "village_economy_runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Per-fixture runtime crate for `assets/sim/village_economy.sim` —
# noncombat acceptance fixture that exercises all four architectural
# lift primitives (Lift A travel, Lift B recipes/wear, Lift C consent/
# announce, Lift D skills/obligations) in a single runtime tick chain.
#
# Mirrors `spy_network_runtime`'s shape (mask + score + chronicle +
# apply per-tick cascade) at N=8 with creature_type-gated verbs (2
# blacksmiths, 2 nobles, 4 villagers). The `.ability` corpus under
# `assets/ability_test/village_economy/` is registry-binding-check
# material — the dispatcher walks each program's effects when the
# verb's gated action_id fires, and consumer rules in the .sim
# translate the chronicle records into per-agent SoA writes (re-purposed
# columns: mana = recipes, shield_hp = wear, hp = skill,
# hunger = consent, disguise_expires_at_tick = travels).

[dependencies]
engine = { path = "../engine" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }
