[package]
name = "threats_struct_probe_runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Plan G G3 final composition — per-fixture runtime crate for
# `assets/sim/threats_struct_probe.sim`. Sibling to threats_view_probe_runtime,
# upgraded to the struct-payload `ThreatZoneCell` ring (8 fields × K=4
# cells/agent) populated by the PerAgentEventScan dispatch.
#
# Behavioural pin: at tick 0, alive agents stamp busy_with_ability_id; the
# PerAgentEventScan fold then dispatches per (observer, source_candidate)
# pair, busy-filters non-busy candidates, and ring-appends a struct cell
# at the observer's slot per qualifying source. Each cell is the 8-field
# ThreatZoneCell carrying the projected zone metadata.
#
# Build.rs lowers the .sim through the DSL compiler into
# `OUT_DIR/generated.rs`; src/lib.rs owns the GPU context, per-buffer
# storage (cells ring sized for 8-u32 cells), kernel cache, and per-tick
# dispatch chain.

[dependencies]
engine = { path = "../engine" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
dsl_compiler = { path = "../dsl_compiler" }

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }
