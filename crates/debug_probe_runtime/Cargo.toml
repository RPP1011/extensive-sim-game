[package]
name = "debug_probe_runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Per-fixture runtime crate for `assets/sim/debug_probe.sim` —
# Compiler Debug Mode (Phase 2) `DebugWgslFlags` end-to-end exercise
# (task #242). Opts in to ALL 3 instrumentation axes
# (event_kind_histogram + mask_hit_rate + score_kernel_visits) and
# allocates / binds / reads back the matching counter buffers.
#
# Behavioral test pin: drive 1 tick at agent_cap=100 and assert all 3
# readbacks return non-zero data.

[dependencies]
engine = { path = "../engine" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }
