[package]
name = "sims"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Plan E-A6 follow-up: a single mega-crate that hosts every fixture.
# `build.rs` scans `assets/sim/*.sim` and emits a `pub mod <fixture>`
# for each. Adding a new fixture = drop a `.sim` file, rebuild — no
# new crate, no Cargo.toml plumbing, no per-fixture lib.rs shim.
#
# Coexists with the legacy per-fixture `*_runtime` crates during
# migration. New fixtures should land here only; existing fixtures
# migrate one at a time.

[dependencies]
engine = { path = "../engine" }
# Plan A — the frozen runtime/player seam. The generated runtime cores
# `impl engine_play_api::PlayableRuntime for GeneratedRuntime`, and
# `make_playable()` boxes each fixture as a `dyn PlayableRuntime`.
engine_play_api = { path = "../engine_play_api" }
# Voxel terrain + GPU mirror for fixtures whose .sim binds `voxel_grid`
# (e.g. hill_raid's `terrain.line_of_sight` gate). Auto-emitted
# `GeneratedRuntime` references `engine_voxel::VoxelTerrain` and
# `engine_voxel::VoxelMirror` only when build_helper detects a
# voxel_grid binding in the kernel manifest; voxel-free fixtures
# don't pull any code from this dep at link time, but the path
# entry has to be here so cargo resolves the import.
engine_voxel = { path = "../engine_voxel" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
# Runtime deps for the synthesized try_new() — when a fixture has a
# companion `assets/ability_test/<fixture>/` directory, the generated
# runtime parses each .ability file via `dsl_ast::parse_ability_file`
# and builds the registry via `dsl_compiler::ability_registry::build_registry`
# at runtime. Per-fixture corpus contents are baked into the binary via
# `include_str!` so no runtime file I/O is required, but the parse +
# build_registry passes themselves run on first try_new() to keep one
# code shape across hot-reload + future incremental rebuild paths.
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }

[dev-dependencies]
# cpu_determinism_forest_fire integration test uses engine_data::events::Event
# and engine_data::ids::AgentId directly to drive the CPU fold path.
engine_data = { path = "../engine_data" }
# edgeworld_render (Task 6) dumps top-down PNG frames of the survival sim.
# png-only build (no jpeg/tiff/codecs) keeps the dev build lean.
image = { version = "0.25", default-features = false, features = ["png"] }
# Plan A — the playable_registry test parses the emitted ui_descriptor()
# through engine_ui::UiModel::from_json. Dev-only so the sims lib itself
# stays free of any UI/egui dependency.
engine_ui = { path = "../engine_ui" }
# S6 (webband port) — the campaign bridge test (webband_campaign.rs)
# drives the webband_colony fixture day by day through webband_app's
# storyteller/dawn-fold and injects the resolved tropes back through the
# fixture's seams. Dev-only ON PURPOSE: the sims lib never depends on
# the host layer, and webband_app never depends on the engine — the
# bridge lives in the test, which is the only place both meet.
webband_app = { path = "../webband_app" }
# S12 — the bridge was PROMOTED out of `tests/webband_bridge/mod.rs` into a
# real library so the playable binary (`crates/webband_play`) drives the same
# campaign loop the tests pin. This is a dev-dependency CYCLE
# (webband_bridge -> sims -> [dev] webband_bridge); cargo permits it because
# dev-dependencies never participate in a library build, and it is the shape
# that keeps `cargo test -p sims --test webband_campaign` working unchanged.
webband_bridge = { path = "../webband_bridge" }
serde_json = "1"

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }
