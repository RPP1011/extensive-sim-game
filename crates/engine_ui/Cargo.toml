[package]
name = "engine_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.33"
# Plan A/C — the `ui {}` DSL block lowers to a JSON descriptor that the
# viewer parses back into a `UiModel` via `UiModel::from_json`. The serde
# reprs (externally-tagged enums) MUST match the compiler's hand-emitted
# JSON in `dsl_compiler::cg::emit::ui_model`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
