[package]
name = "engine_voxel"
version = "0.1.0"
edition = "2021"

# Adapter crate: bridges `~/Projects/voxel_engine` to the sim engine via the
# `TerrainQuery` seam. Phase A (Task #250) ships the CPU-side skeleton —
# `VoxelTerrain` wraps `voxel_engine::voxel::grid::VoxelGrid` and implements
# the 3 trait methods. Phases B-E follow:
#   B — chronicle event consumer (place_voxel / harvest events mutate state)
#   C — wgpu storage-buffer mirror for GPU kernel reads
#   D — DSL → WGSL emit for terrain queries
#   E — production fixture opt-in + determinism pin
#
# voxel_engine is pinned to a git rev on github.com/RPP1011/voxel_engine; we
# touch only `voxel::grid` + `voxel::raycast`. The `default = []` feature
# set means `winit`/`egui` are NOT pulled. Vulkan deps (ash + gpu-allocator)
# and the `shaderc` build-dep ARE unconditional in voxel_engine — they get
# compiled whether or not we use them. Sim engine consumers without voxel
# terrain simply don't depend on this crate, so they don't pay that cost.

[dependencies]
engine = { path = "../engine" }
voxel_engine = { git = "https://github.com/RPP1011/voxel_engine", rev = "02d21a2866f53603ce89c5708c4a10e771e19bf8", default-features = false }
glam = "0.29"
# Phase C — GPU-resident voxel mirror needs `wgpu::Buffer` + `bytemuck`
# slice casts. wgpu version pinned to match `engine`'s `=26.0.1` so we
# don't accidentally pull two wgpu versions into the dep graph.
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
