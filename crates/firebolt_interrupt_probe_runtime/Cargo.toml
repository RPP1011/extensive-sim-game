[package]
name = "firebolt_interrupt_probe_runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Per-fixture runtime crate for `assets/sim/firebolt_interrupt_probe.sim`
# — Plan G slice G2.5. Variant of `firebolt_probe_runtime` that adds two
# new physics rules on top of the cast → busy → resolve → damage loop:
#
#   * `InjectDamage` (per_agent) — at a configured tick, emits a Damaged
#     event on every alive agent (simulates an external attack mid-cast).
#   * `InterruptCastOnDamage` (post) — chronicle consumer; clears the
#     busy SoA columns whenever a Damaged event lands on a target whose
#     busy_until_tick > 0.
#
# Behavioural pin: with inject_at_tick=1, inject_amount=10, the
# original cast (busy_until_tick=3) is interrupted at tick 1 → hp=90.
# A second cast starts at tick 2 (busy_until_tick=5), so ResolveBusy
# does NOT fire at tick 3 (the firebolt_probe baseline's resolve tick).
# The diff vs firebolt_probe_runtime — hp=90 not 75 at tick 3 — is the
# behavioural signal that interrupt fired.
#
# The build.rs tolerates lower diagnostics (P6 PerEvent + agents.set_hp)
# — same pattern as firebolt_probe_runtime.

[dependencies]
engine = { path = "../engine" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
dsl_compiler = { path = "../dsl_compiler" }

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }
