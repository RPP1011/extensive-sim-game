[package]
name = "spy_network_runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Per-fixture runtime crate for `assets/sim/spy_network.sim` — multi-
# faction social-cascade fixture composing Disguise + Slander + Strike
# into a noble-dies-from-slander-pile-on behavioral pin. Mirrors
# `duel_1v1_runtime`'s mask + score + chronicle + apply per-tick chain
# but at N=10 with creature_type-gated verbs (3 spies, 3 nobles, 4
# commoners). The `.ability` corpus under
# `assets/ability_test/spy_network/` is registry-binding-check
# material — the real chronicle writes live in the .sim verb bodies,
# NOT in apply_ability dispatch (the .ability lowering surface doesn't
# ship `disguise` / `plant_belief` verbs, and no new lowering surface
# is in scope for this fixture).

[dependencies]
engine = { path = "../engine" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }
