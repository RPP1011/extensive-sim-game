[package]
name = "stress_cast_density_runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Stress test fixture B (task #238) — drives the apply_ability dispatcher
# at maximum AOE candidate density to find the chronicle ring saturation
# point and Spread bitonic-sort scaling. All agents are seeded inside a
# single 27-cell hash bin so every Spread walk collects every other
# agent (capped at the 256-slot bitonic sort scratch). Per cast =
# up to 256 EffectDamageApplied chronicle records; per tick = agent_cap
# × ~256 events. Driver records the agent_cap at which the dispatch
# first overflows the 65 536-slot ring header (`if (_slot < 65536u)` in
# `crates/dsl_compiler/src/cg/emit/wgsl_body.rs`).

[dependencies]
engine = { path = "../engine" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }
