[package]
name = "webband_bridge"
version = "0.1.0"
edition = "2021"

# S12: THE SHARED HOST<->FIXTURE BRIDGE, promoted from
# `crates/sims/tests/webband_bridge/mod.rs` (S9) to a real library so the
# playable binary (`crates/webband_play`) and the two integration tests
# (`sims --test webband_campaign` / `--test webband_spine`) drive ONE copy of
# the campaign loop. Behaviour-neutrality is proved by those tests' own
# cross-process digests, unchanged.
#
# Dependency shape: this crate depends on `sims` (the compiled fixture) and
# `webband_app` (the campaign brain) — the two halves the bridge exists to
# join. `sims` in turn dev-depends on THIS crate for its two webband test
# binaries; that is a dev-dependency cycle, which cargo permits precisely
# because dev-dependencies never participate in a library build.

[dependencies]
sims = { path = "../sims" }
webband_app = { path = "../webband_app" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
# S12 D2 — the host half of a save (Bridge seating + counters). Campaign
# itself is already serde in webband_app; float_roundtrip matters there and
# is enabled by that crate.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
