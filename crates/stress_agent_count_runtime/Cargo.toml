[package]
name = "stress_agent_count_runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Per-fixture runtime crate for `assets/sim/stress_agent_count.sim` —
# Fixture A from `docs/superpowers/plans/2026-05-09-stress-test-runtime-ceilings.md`
# (one-shot characterization for the agent_count ceiling).
#
# Single self-target Pulse verb with a no-op consumer. Drives the
# standard mask → score → chronicle → consume per-tick chain at
# variable agent_cap; the `stress_agent_count_app` binary sweeps
# 1k → 200k and emits NDJSON per-tick metrics + a final summary.

[dependencies]
engine = { path = "../engine" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }

[[bin]]
name = "stress_agent_count_app"
path = "src/bin/stress_agent_count_app.rs"
