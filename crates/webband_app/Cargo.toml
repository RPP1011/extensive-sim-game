[package]
name = "webband_app"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the save format must reproduce f64s bit-exactly (the
# determinism law) — serde_json's default float parse is lossy in the last ulp.
# Promoted from dev-dependencies in S7b: campaign save/load is library code.
serde_json = { version = "1", features = ["float_roundtrip"] }
