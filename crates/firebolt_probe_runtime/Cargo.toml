[package]
name = "firebolt_probe_runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Per-fixture runtime crate for `assets/sim/firebolt_probe.sim` — Plan G
# slice G4. Closes the cast → busy → resolve → damage loop end-to-end on
# real wgpu hardware. The fixture has 2 agents that each cast a deferred
# Firebolt (3-tick cast window, 25 damage on resolve) at themselves.
#
# Rule chain per tick:
#   1. physics_DispatchFirebolt (per_agent) — apply_ability dispatcher
#      writes EffectCastBeginApplied chronicle records when each agent's
#      busy_until_tick is 0.
#   2. seed_indirect_0 — plumbing kernel for indirect-args parity.
#   3. physics_RecordCastBegin (post) — chronicle consumer; stamps the
#      four busy SoA fields (busy_until_tick, busy_with_ability_id,
#      busy_started_at_tick, busy_target_slot).
#   4. physics_ResolveBusy (per_agent) — fires EffectDamageApplied when
#      `world.tick >= busy_until_tick > 0`, clears busy state.
#   5. physics_ApplyChronicleDamage (post) — decrements agent_hp by
#      the chronicle's amount field.
#
# The build.rs tolerates lower diagnostics (P6 PerEvent + agents.set_hp)
# — same pattern as apply_ability_chronicle_consumer_runtime.

[dependencies]
engine = { path = "../engine" }
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
dsl_compiler = { path = "../dsl_compiler" }

[build-dependencies]
dsl_ast = { path = "../dsl_ast" }
dsl_compiler = { path = "../dsl_compiler" }
