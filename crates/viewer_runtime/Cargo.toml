[package]
name = "viewer_runtime"
version = "0.1.0"
edition = "2021"

# Windowed viewer over a deterministic sim. Pilot fixture is
# `sims::dungeon_horde::GeneratedRuntime` — the dungeon-crawl stage 3
# (5 heroes vs ~800-1000 enemies in a procedurally-rolled multi-room
# voxel dungeon). The viewer reads the GPU agent SoA back to host each
# tick and mirrors agent positions + colours into a single
# world-spanning voxel grid the renderer consumes via voxel_engine's
# `render_frame_gpu`.
#
# This crate is the *presentation* seam — sim itself stays in
# `crates/sims` (mega-crate); viewer just reads its snapshots.

[dependencies]
engine = { path = "../engine" }
engine_voxel = { path = "../engine_voxel" }
# Mega-crate housing all migrated `.sim` fixtures, including
# dungeon_horde. We use `sims::dungeon_horde::GeneratedRuntime`.
sims = { path = "../sims" }

# Declarative game-UI layer (HUD widgets / menu / death screens) the
# vs_viewer renders over the voxel scene via egui. Plan 4.
engine_ui = { path = "../engine_ui" }
# egui for the playable HUD/menu/death overlay. Must match the version
# voxel_engine's `app-harness` feature pulls in so cargo unifies.
egui = "0.33"

# voxel_engine path dep with `app-harness` enabled (winit + egui).
# Path matches the dep in `engine_voxel` so cargo unifies the dep
# rather than building two copies. The `app-harness` feature is
# additive — `engine_voxel` builds with default features, viewer adds
# the harness for windowing.
voxel_engine = { git = "https://github.com/RPP1011/voxel_engine", rev = "a85f195834e056bf842167974f1b510308318b46", features = ["app-harness"] }

glam = "0.29"
anyhow = "1"
winit = "0.30"
# Bridge types for the egui overlay path (vk::CommandPool).
# Must match voxel_engine's ash version.
ash = "0.38"
# wgpu — the sim runtime's GPU context type. Used by the viewer to
# read agent SoA back from device memory each tick.
wgpu = "=26.0.1"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.4"

# glTF static-mesh loading for agent character models (Kenney's
# `mini-characters` pack lives in assets/models/). We use `gltf`'s
# default + import features but disable extras feature to keep the
# build light; we don't need extras since the kit is plain
# vertices + indices + (optional) colors.
gltf = { version = "1.4", default-features = false, features = ["import", "names", "utils"] }

[dev-dependencies]
# Headless top-down GIF capture of the VS sim (examples/vs_capture.rs) —
# renders agent positions/roles to frames without a display. gif codec only.
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
