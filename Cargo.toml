[workspace]
members = ["crates/dsl_ast", "crates/dsl_compiler", "crates/engine", "crates/engine_data", "crates/engine_gpu_rules", "crates/engine_play", "crates/engine_play_api", "crates/engine_ui", "crates/engine_voxel", "crates/sim_app", "crates/sims", "crates/tom_probe_runtime", "crates/viewer_runtime"]
exclude = ["crates/world_sim_bench", "crates/ability_operator", "crates/ability-vae", "crates/combat-trainer"]
resolver = "2"

# Phase 7 wolf-sim wipe (2026-05-02): the heaviest deletes — engine_gpu,
# engine_rules, viz, tactical_sim, xtask, src/, plus all legacy emitters
# under crates/dsl_compiler/src/emit_*.rs — stayed gone. `engine` and
# `engine_data` were restored on 2026-05-02 (commit TBD): they hold the
# general data-structure infrastructure (Agent SoA, event ring, snapshot,
# spatial hash, RNG) the new minimum DSL fixture needs to actually run.
# `engine` no longer hand-duplicates the wolf-sim CreatureType vocabulary
# (schema_hash.rs and snapshot/format.rs now delegate to
# engine_data::entities::CreatureType::{ALL,from_disc} instead of hardcoding
# it a second time — trimmed 2026-09-03). `engine_data` itself still
# hand-maintains a fixed 4-species CreatureType enum with no live DSL/codegen
# source behind it; making that generic is unstarted, separate work (see
# crates/engine_data/CLAUDE.md, "Provenance").
