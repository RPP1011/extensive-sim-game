name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config \
            mesa-vulkan-drivers vulkan-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --workspace --lib --bins

      # Lavapipe (Mesa software vulkan) provides a wgpu-compatible
      # adapter on GPU-less CI runners. Without VK_ICD_FILENAMES wgpu
      # falls through to NoAdapter; with it, kernels run on CPU at
      # ~10x slower than a real GPU. RUST_MIN_STACK is required by
      # AOE Path B's naga validator (see project_aoe_gotchas memory).
      - name: cargo test (unit + integration)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          RUST_MIN_STACK: "33554432"
        run: cargo test --workspace --lib --tests -- --test-threads=1

  architecture-guards:
    name: Architecture Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ast-grep
        uses: taiki-e/install-action@v2
        with:
          tool: ast-grep

      - name: ast-grep scan (architectural rules)
        run: ast-grep scan

      # Note: the legacy `xtask compile-dsl` + engine_rules diff check
      # was retired with the Phase 7 wolf-sim wipe (2026-05-02). Each
      # *_runtime crate's build.rs now compiles its own .sim source on
      # `cargo check`; staleness surfaces as a per-crate compile error
      # in the Check & Test job.

      - name: Schema hash freshness
        run: cargo test -p engine --test schema_hash

  determinism:
    name: Determinism Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config \
            mesa-vulkan-drivers vulkan-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Post-wolf-sim-wipe (2026-05-02), `tactical_sim` no longer exists.
      # The closest semantic determinism pin is wave_defense's
      # `same_seed_same_death_tick` — same world seed must reproduce the
      # exact death tick across reruns. Lavapipe + RUST_MIN_STACK
      # rationale matches the Check & Test job above.
      - name: Run wave_defense determinism pin (release)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          RUST_MIN_STACK: "33554432"
        run: cargo test -p wave_defense_runtime --release same_seed_same_death_tick -- --test-threads=1
